name: Deploy site

# Regenera projects.json con los repos pineados y publica la web.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/update-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Solo lo publicable: fuera scripts/, .github/ y demás
      - run: |
          mkdir _site
          cp -r index.html 404.html main.js cards.mjs style.css projects.json robots.txt sitemap.xml llms.txt \
                favicon.svg favicon.ico apple-touch-icon.png icon-512.png site.webmanifest og.png \
                fonts proyectos servicios _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
